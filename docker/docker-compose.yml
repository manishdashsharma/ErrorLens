services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: errorlens
      POSTGRES_PASSWORD: errorlens
      POSTGRES_DB: errorlens
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./inngest-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U errorlens -d errorlens']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  inngest:
    image: inngest/inngest:latest
    restart: unless-stopped
    command: 'inngest start'
    environment:
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY}
      INNGEST_POSTGRES_URI: postgres://errorlens:errorlens@postgres:5432/inngest
      INNGEST_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - '8288:8288' # Event API, REST/GraphQL API, dashboard UI
      - '8289:8289' # Connect WebSocket gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app:
    image: ghcr.io/manishdashsharma/errorlens:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://errorlens:errorlens@postgres:5432/errorlens
      DATABASE_READ_URL: postgresql://errorlens:errorlens@postgres:5432/errorlens
      REDIS_CLUSTER_URLS: redis://redis:6379
      INNGEST_BASE_URL: http://inngest:8288
      INNGEST_SERVE_ORIGIN: http://app:3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inngest:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
