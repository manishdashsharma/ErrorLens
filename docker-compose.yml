services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: errorlens
      POSTGRES_PASSWORD: errorlens
      POSTGRES_DB: errorlens
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./inngest-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U errorlens -d errorlens']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  inngest:
    image: inngest/inngest:latest
    restart: unless-stopped
    command: 'inngest start'
    environment:
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY}
      INNGEST_POSTGRES_URI: postgres://errorlens:errorlens@postgres:5432/inngest
      INNGEST_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - '8288:8288' # Event API, REST/GraphQL API, dashboard UI
      - '8289:8289' # Connect WebSocket gateway
    extra_hosts:
      - 'host.docker.internal:host-gateway' # Linux needs this explicitly; Docker Desktop (macOS/Windows) provides it natively
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
